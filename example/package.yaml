name:                example
version:             0.1.0.0
github:              "tusharad/pgqueuer-hs"
license:             MIT
author:              "Tushar Adhatrao"
maintainer:          "tusharadhatrao@gmail.com"
copyright:           "2026 Tushar Adhatrao"

extra-source-files:
- README.md
- CHANGELOG.md
- LICENSE

description:         Please see the README on GitHub at <https://github.com/tusharad/pgqueuer-hs#readme>

dependencies:
- base >= 4.7 && < 5
- pgqueuer-hs
- uuid
- postgresql-simple
- bytestring
- aeson
- text
- time

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

executables:
  hello-mailer:
    main:                app/01-hello-mailer.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - random

  resilient-scraper:
    main:                app/02-resilient-scraper.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

  map-reduce-etl:
    main:                app/03-map-reduce-etl.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

  chaos-ecommerce:
    main:                app/04-chaos-ecommerce.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - random

  hasql-worker:
    main:                app/05-hasql-worker.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

  cron-pipeline:
    main:                app/06-cron-pipeline.hs
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
