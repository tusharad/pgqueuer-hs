name:                pgqueuer-hs
version:             0.0.1.0
github:              "tusharad/pgqueuer-hs"
license:             MIT
author:              "Tushar Adhatrao"
maintainer:          "tusharadhatrao@gmail.com"
copyright:           "2026 Tushar Adhatrao"

extra-doc-files:
- README.md
- CHANGELOG.md
- LICENSE
- CONTRIBUTING.md

# Metadata used when publishing your package
synopsis:            High-performance PostgreSQL background job queue with cron and workflows
category:            Database, Concurrency, Distributed Computing
stability:           experimental
tested-with:         GHC == 9.8.4, GHC == 9.10.3

description: |
  A high-throughput, type-safe PostgreSQL-backed job queue for Haskell applications.
  Inspired by pgqueuer in Python, pgqueuer-hs leverages PostgreSQL's LISTEN / NOTIFY
  and `FOR UPDATE SKIP LOCKED` for reliable, non-contending, at-least-once distributed job processing.

  Key features:
  * Zero-polling real-time dispatch via PostgreSQL LISTEN / NOTIFY
  * Non-contending job claims using `FOR UPDATE SKIP LOCKED`
  * Dual backend support: `SimpleDb` (postgresql-simple) and `HasqlDb` (binary protocol via Hasql)
  * Declarative Workflow DAG orchestration (`JobTree` and `<~~` operator)
  * Native recurring cron job scheduling
  * Pluggable retry backoff policies (constant, linear, exponential) with full and equal jitter
  * Write batching and rate limiting via `TimedOverflowBuffer` to protect PostgreSQL WAL
  * Full end-to-end distributed tracing support

  For getting started and runnable examples, please see the README on GitHub at
  <https://github.com/tusharad/pgqueuer-hs#readme>.

flags:
  otel:
    description: Enable OpenTelemetry tracing integration
    manual: true
    default: false

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.0 && < 3
- async >= 2.2 && < 3
- bytestring >= 0.10.4.0 && < 0.13
- containers >= 0.6 && < 0.8
- contravariant >= 1.5 && < 2
- cron >= 0.7 && < 1
- hasql >= 1.6 && < 1.10
- hasql-pool >= 1.2 && < 1.4
- mtl >= 2.2 && < 3
- postgresql-simple >= 0.7 && < 0.9
- stm >= 2.5 && < 3
- text >= 1.2 && < 3
- time >= 1.9 && < 2
- unliftio >= 0.2 && < 0.3
- uuid >= 1.3 && < 2
- vector >= 0.12 && < 1
- random >= 1.2 && < 1.3
- unordered-containers >= 0.2 && < 0.3

when:
  - condition: flag(otel)
    dependencies:
      - hs-opentelemetry-api
      - hs-opentelemetry-propagator-w3c
      - http-types
      - case-insensitive
    cpp-options: -DOTEL

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wredundant-constraints
- -Wno-partial-fields

library:
  source-dirs: src

tests:
  pgqueuer-hs-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pgqueuer-hs
    - async >= 2.2 && < 3
    - tasty >= 1.4 && < 2
    - tasty-hunit >= 0.10 && < 1
    - testcontainers >= 0.5 && < 0.6

benchmarks:
  pgqueuer-hs-bench:
    main:                Main.hs
    source-dirs:         bench
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pgqueuer-hs
    - tasty-bench >= 0.3 && < 1
    - tasty >= 1.4 && < 2
