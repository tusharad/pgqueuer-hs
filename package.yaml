name:                pgqueuer-hs
version:             0.0.1.0
github:              "tusharad/pgqueuer-hs"
license:             MIT
author:              "Tushar Adhatrao"
maintainer:          "tusharadhatrao@gmail.com"
copyright:           "2026 Tushar Adhatrao"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
synopsis:            PostgreSQL powered Job queue
category:            Database

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/tusharad/pgqueuer-hs#readme>

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.0 && < 3
- async >= 2.2 && < 3
- bytestring >= 0.10.4.0 && < 0.13
- containers >= 0.6 && < 0.8
- contravariant >= 1.5 && < 2
- cron >= 0.7 && < 1
- hasql >= 1.6 && < 2
- hasql-pool >= 1.2 && < 2
- mtl >= 2.2 && < 3
- postgresql-simple >= 0.7 && < 0.9
- stm >= 2.5 && < 3
- text >= 1.2 && < 3
- time >= 1.9 && < 2
- unliftio >= 0.2 && < 0.3
- uuid >= 1.3 && < 2
- vector >= 0.12 && < 1
- random >= 1.2 && < 1.3

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wredundant-constraints
- -Wno-partial-fields

library:
  source-dirs: src

tests:
  pgqueuer-hs-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pgqueuer-hs
    - async >= 2.2 && < 3
    - tasty >= 1.4 && < 2
    - tasty-hunit >= 0.10 && < 1

benchmarks:
  pgqueuer-hs-bench:
    main:                Main.hs
    source-dirs:         bench
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - pgqueuer-hs
    - tasty-bench >= 0.3 && < 1
    - tasty >= 1.4 && < 2
